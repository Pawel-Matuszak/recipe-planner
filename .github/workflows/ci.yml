name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: obiadki
          POSTGRES_PASSWORD: obiadki
          POSTGRES_DB: obiadki_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U obiadki -d obiadki_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://obiadki:obiadki@localhost:5432/obiadki_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci # also generates the Prisma client (postinstall)
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
