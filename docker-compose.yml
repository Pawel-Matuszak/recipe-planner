# Local Postgres for development and tests. Neon runs Postgres 17 here too.

services:
  db:
    image: postgres:17.10-alpine
    environment:
      POSTGRES_USER: obiadki
      POSTGRES_PASSWORD: obiadki
      POSTGRES_DB: obiadki
    ports:
      - "54322:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obiadki -d obiadki"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  db-data:
