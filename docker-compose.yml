# Local Postgres for development and tests. Same major version as Neon (18).

services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: obiadki
      POSTGRES_PASSWORD: obiadki
      POSTGRES_DB: obiadki
    ports:
      - "54322:5432"
    volumes:
      - db-data:/var/lib/postgresql # Postgres 18 images keep data in a versioned subfolder
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obiadki -d obiadki"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  db-data:
